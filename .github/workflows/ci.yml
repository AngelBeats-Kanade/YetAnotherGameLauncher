# 基于 GitHub 官方 .NET 模板（actions/starter-workflows ci/dotnet.yml）改造：
# 双平台 matrix、零警告构建、MTP 测试执行体直跑、格式校验、NuGet 缓存。
# v* tag 额外触发发布管道：测试全绿 → Release 配置双平台自包含包 → 草稿 GitHub Release。
name: CI

on:
  push:
    branches: [main]
    # 版本标签（v*）既过测试门禁，也触发发布管道（package/draft-release 两个 job）
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 默认最小权限；draft-release job 单独提权 contents: write
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 仓库硬约束之一：whitespace 格式零差异（ubuntu 单腿快速失败）
  format:
    name: format (whitespace)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify whitespace formatting
        run: dotnet format whitespace --verify-no-changes

  build-and-test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # setup-dotnet v6 的内置缓存要求 packages.lock.json（本仓库无锁文件），退回 actions/cache
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore dependencies
        run: dotnet restore
      # 零警告是仓库硬约束（TreatWarningsAsErrors=true）
      - name: Build (zero warnings)
        run: dotnet build --no-restore -warnaserror
      # 官方模板用 dotnet test --no-build；本仓库验证过的方式是直接运行 xunit.v3/MTP
      # 测试执行体（dotnet test 在部分环境发现 0 个测试），失败即非零退出码。
      # 失败时把 [FAIL] 用例名写进 ::error:: 注解——actions 日志需要管理员权限才能拉取，
      # 注解走 check-runs API 公开可读，任何环境都能直接定位偶发用例
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          suites=(
            tests/YetAnotherGameLauncher.App.Tests/bin/Debug/net10.0/YetAnotherGameLauncher.App.Tests.dll
            tests/YetAnotherGameLauncher.Core.Tests/bin/Debug/net10.0/YetAnotherGameLauncher.Core.Tests.dll
            tests/YetAnotherGameLauncher.Channels.Kuro.Tests/bin/Debug/net10.0/YetAnotherGameLauncher.Channels.Kuro.Tests.dll
            tests/YetAnotherGameLauncher.Channels.Hypergryph.Tests/bin/Debug/net10.0/YetAnotherGameLauncher.Channels.Hypergryph.Tests.dll
          )
          overall=0
          for suite in "${suites[@]}"; do
            name="$(basename "$suite" .dll)"
            echo "=== $name ==="
            dotnet "$suite" 2>&1 | tee "/tmp/${name}.log" || overall=1
          done
          if [ "$overall" -ne 0 ]; then
            failed="$(grep -hE '\[FAIL\]' /tmp/*.log | sed 's/^[[:space:]]*//' | head -20 | tr '\n' ' ')"
            echo "::error::failing cases: ${failed:-（详见对应 suite 日志）}"
            exit 1
          fi
          # 禁用形态守卫（2026-09-19 审计）：Dispatch(async ...) 是吞断言的假绿形态
          # （docs/audit/phase0/DISPATCH-PROBE.md 实锤），任何新引入即红。
          if git grep -n 'Dispatch(async' -- tests/ | grep -v '禁用\|吞断言\|实锤\|原实现' ; then
            echo "::error::Dispatch(async ...) 禁用形态回归（吞断言假绿），见 docs/audit/tests/CRITERIA.md D1"
            exit 1
          fi

      # 覆盖率门禁（ubuntu 单腿）：行覆盖不得低于既定基线——防止"新增代码不配测试"静默退化。
      # 口径与 docs/audit 一致（仅本仓库 src/ 的 .cs）；基线提升流程：本地复测 →
      # 改 THRESHOLD → 同一 commit 内补齐缺口测试。
      - name: Coverage gate (line >= 83%)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -o pipefail
          dotnet tool install --global dotnet-coverage >/dev/null 2>&1
          export PATH="$PATH:$HOME/.dotnet/tools"
          mkdir -p /tmp/cov
          suites=(
            tests/YetAnotherGameLauncher.Core.Tests/bin/Debug/net10.0/YetAnotherGameLauncher.Core.Tests.dll
            tests/YetAnotherGameLauncher.Channels.Kuro.Tests/bin/Debug/net10.0/YetAnotherGameLauncher.Channels.Kuro.Tests.dll
            tests/YetAnotherGameLauncher.Channels.Hypergryph.Tests/bin/Debug/net10.0/YetAnotherGameLauncher.Channels.Hypergryph.Tests.dll
            tests/YetAnotherGameLauncher.App.Tests/bin/Debug/net10.0/YetAnotherGameLauncher.App.Tests.dll
          )
          i=0
          for suite in "${suites[@]}"; do
            i=$((i+1))
            dotnet-coverage collect -f cobertura -o "/tmp/cov/$i.xml" dotnet "$suite" > /dev/null
          done
          node scripts/coverage-gate.mjs 0.83 /tmp/cov/1.xml /tmp/cov/2.xml /tmp/cov/3.xml /tmp/cov/4.xml

  # v* tag 专属：Release 配置双平台自包含发布物并打包。
  # needs 测试门禁——绿 tag 才出包；ubuntu 原生构建的 linux 包比本机（滚动发行版）glibc 门槛更低
  package:
    name: package (${{ matrix.rid }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [format, build-and-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      # tag 名必须与单一事实源 Directory.Build.props 的版本一致，防错包
      - name: Verify tag matches package version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PROPS_VERSION="$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)"
          if [ "$VERSION" != "$PROPS_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 Directory.Build.props 版本 ${PROPS_VERSION} 不一致"
            exit 1
          fi
      - name: Publish (self-contained)
        run: dotnet publish src/YetAnotherGameLauncher -c Release -r ${{ matrix.rid }} --self-contained -o publish/${{ matrix.rid }}
      # 包内顶层目录带版本名（与 README 的手工 publish 命名一致），解压即用
      - name: Package (tar.gz)
        if: runner.os == 'Linux'
        run: |
          VERSION="$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)"
          tar -czf "YetAnotherGameLauncher-${VERSION}-linux-x64.tar.gz" \
            --transform "s,^linux-x64,YetAnotherGameLauncher-${VERSION}-linux-x64," \
            -C publish linux-x64
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Directory.Build.props -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
          # 不用系统自带 tar.exe（libarchive 旧版写 zip 行为不稳）也不用 Compress-Archive
          # （Windows 上产 '\' 条目名，dotnet/runtime#98247 同类坑）：
          # 用 runner 预装的 7-Zip 产 '/' 条目名的 zip；先重命名顶层目录带上版本号
          Rename-Item -Path "publish/win-x64" -NewName "YetAnotherGameLauncher-$version-win-x64"
          & "7z" a -tzip "YetAnotherGameLauncher-$version-win-x64.zip" ".\publish\YetAnotherGameLauncher-$version-win-x64"
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          Get-Item "YetAnotherGameLauncher-$version-win-x64.zip" | Select-Object Name, Length
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.rid }}
          path: YetAnotherGameLauncher-*
          if-no-files-found: error
          retention-days: 7

  # v* tag 专属：汇总双平台包，建草稿 Release（人工检查后手动 Publish）。
  # 唯一提权点：contents: write，仅用于创建草稿 Release
  draft-release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: packages
      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ESCAPED="${VERSION//./\\.}"
          awk -v pat="^## \\[${ESCAPED}\\]" '
            $0 ~ pat { flag = 1; next }
            flag && (/^## / || /^\[/) { exit }
            flag { print }
          ' CHANGELOG.md > release_notes.md
          [ -s release_notes.md ] || echo "See CHANGELOG.md for the full release notes." > release_notes.md
      # tag 移动重跑时清掉旧草稿（仅草稿；已发布的 Release 报错中止，绝不误删）
      - name: Remove stale draft with the same tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            if [ "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)" = "True" ]; then
              gh release delete "${GITHUB_REF_NAME}" --yes
            else
              echo "::error::release ${GITHUB_REF_NAME} 已存在且已发布，请改用新版本号"
              exit 1
            fi
          fi
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          --draft --title "YetAnotherGameLauncher ${GITHUB_REF_NAME#v}"
          --notes-file release_notes.md packages/YetAnotherGameLauncher-*
